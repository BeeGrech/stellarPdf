# Builds a Linux AppImage (Electron + bundled python/venv with PyMuPDF).
# Publishes to GitHub Releases: rolling "nightly" prerelease (schedule + manual),
# and attaches the AppImage to version tags v* when you push them.
# Scheduled runs are skipped when the default branch HEAD matches tag "nightly"
# (no new commits since the last nightly). Manual dispatch and v* tags always build.
#
# dist/ and *.AppImage stay out of git (.gitignore); CI is the source of binaries.

name: Linux Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # 05:15 UTC daily (adjust as you like)
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip scheduled run if nothing changed since last nightly
        id: should_build
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin +refs/tags/nightly:refs/tags/nightly 2>/dev/null || true
          if ! git rev-parse -q --verify refs/tags/nightly >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No nightly tag yet; will build."
            exit 0
          fi
          nightly_sha=$(git rev-parse refs/tags/nightly^{commit})
          head_sha=$(git rev-parse HEAD)
          if [ "$nightly_sha" = "$head_sha" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled nightly skipped: default branch is still at $head_sha (same as nightly tag)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New commits since nightly ($nightly_sha -> $head_sha); will build."
          fi

      - uses: actions/setup-node@v4
        if: steps.should_build.outputs.skip != 'true'
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.should_build.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Python venv + PyMuPDF
        if: steps.should_build.outputs.skip != 'true'
        run: |
          python3 -m venv python/venv --copies
          python/venv/bin/pip install -U pip
          python/venv/bin/pip install -r python/requirements.txt

      - name: Install system deps
        if: steps.should_build.outputs.skip != 'true'
        run: |
          sudo apt-get install -y rpm xvfb libgtk-3-0 libgbm-dev libnss3 libasound2

      - name: Node install
        if: steps.should_build.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.should_build.outputs.skip != 'true'
        run: npx playwright install chromium --with-deps

      - name: Generate test fixture PDF
        if: steps.should_build.outputs.skip != 'true'
        run: python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: Run Python tests
        if: steps.should_build.outputs.skip != 'true'
        run: npm run test:python

      - name: Run UI tests (headless via xvfb)
        if: steps.should_build.outputs.skip != 'true'
        run: xvfb-run --auto-servernum npm run test:ui

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/ui/report/

      - name: Build AppImage + deb + rpm
        if: steps.should_build.outputs.skip != 'true'
        run: npm run pack:linux -- --publish never

      - uses: actions/upload-artifact@v4
        if: steps.should_build.outputs.skip != 'true'
        with:
          name: stellar-pdf-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

      # Rolling prerelease: move tag "nightly" to this commit, then upload asset.
      # If tag protection blocks force-push, remove protection for "nightly" or use dated tags instead.
      - name: Update nightly tag
        if: steps.should_build.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly -m "Nightly AppImage"
          git push -f origin refs/tags/nightly

      - name: Publish nightly prerelease
        if: steps.should_build.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.AppImage,dist/*.deb,dist/*.rpm"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          name: Nightly (Linux)
          body: |
            Automated build from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            | Format | Distro |
            |--------|--------|
            | `.AppImage` | Universal |
            | `.deb` | Ubuntu / Debian |
            | `.rpm` | Fedora / RHEL |

            [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          skipIfReleaseExists: false

      - name: Publish release packages (version tag)
        if: steps.should_build.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.AppImage,dist/*.deb,dist/*.rpm"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          skipIfReleaseExists: false
