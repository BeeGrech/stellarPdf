name: Smoke Test Installed Packages

on:
  workflow_run:
    workflows: ["Build & Publish Linux Packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "linux-appimage workflow run ID to download artifacts from"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # ── Resolve the artifact run ID ──────────────────────────────────────────────
  resolve-artifact:
    runs-on: ubuntu-22.04
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Upstream build did not succeed — skipping package tests."
          fi

  # ── AppImage ─────────────────────────────────────────────────────────────────
  test-appimage:
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install system deps
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libgbm-dev libnss3 libasound2 fuse libfuse2

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: stellar-pdf-appimage
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate test fixture PDF
        run: |
          python -m venv python/venv
          python/venv/bin/pip install -q PyMuPDF
          python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: Extract AppImage
        run: |
          APPIMAGE=$(ls packages/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          BINARY=$(find squashfs-root -name 'stellar-pdf' -type f | head -1)
          echo "Found binary: $BINARY"
          test -n "$BINARY" && test -f "$BINARY" \
            || { echo "ERROR: stellar-pdf binary not found in squashfs-root"; exit 1; }
          echo "STELLAR_BINARY_PATH=$(pwd)/$BINARY" >> "$GITHUB_ENV"

      - name: Run installed smoke tests (AppImage)
        run: xvfb-run --auto-servernum npm run test:ui:installed

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appimage-test-report
          path: tests/ui/report-installed/

  # ── Debian package ───────────────────────────────────────────────────────────
  test-deb:
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: stellar-pdf-deb
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/

      - name: Install deb package
        run: |
          sudo dpkg -i packages/*.deb || true
          sudo apt-get install -f -y

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate test fixture PDF
        run: |
          python -m venv python/venv
          python/venv/bin/pip install -q PyMuPDF
          python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: Set binary path
        run: |
          PKG=$(dpkg -l | awk '/stellar/{print $2; exit}')
          BINARY=$(dpkg -L "$PKG" | grep '/stellar-pdf$' | while IFS= read -r f; do
            [ -f "$f" ] && [ -x "$f" ] && echo "$f" && break
          done)
          echo "Found binary: $BINARY (package: $PKG)"
          test -n "$BINARY" && test -f "$BINARY" \
            || { echo "ERROR: stellar-pdf binary not found in package $PKG"; exit 1; }
          echo "STELLAR_BINARY_PATH=$BINARY" >> "$GITHUB_ENV"

      - name: Run installed smoke tests (deb)
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libgbm-dev libnss3 libasound2
          xvfb-run --auto-servernum npm run test:ui:installed

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deb-test-report
          path: tests/ui/report-installed/

  # ── RPM package (Fedora container) ───────────────────────────────────────────
  test-rpm:
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    container:
      image: fedora:40
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          dnf install -y nodejs npm xorg-x11-server-Xvfb gtk3 libnotify nss \
            libXScrnSaver libXtst xdg-utils at-spi2-core libuuid alsa-lib \
            libgbm mesa-libgbm nss libdrm wget curl

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Download rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: stellar-pdf-rpm
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/

      - name: Install rpm package
        run: dnf install -y packages/*.rpm

      - name: Generate test fixture PDF
        run: |
          python3 -m venv python/venv
          python/venv/bin/pip install -q PyMuPDF
          python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: Set binary path
        run: |
          PKG=$(rpm -qa | grep -i stellar | head -1)
          BINARY=$(rpm -ql "$PKG" | grep '/stellar-pdf$')
          echo "Found binary: $BINARY (package: $PKG)"
          test -n "$BINARY" && test -f "$BINARY" \
            || { echo "ERROR: stellar-pdf binary not found in package $PKG"; exit 1; }
          echo "STELLAR_BINARY_PATH=$BINARY" >> "$GITHUB_ENV"

      - name: Run installed smoke tests (rpm)
        run: xvfb-run --auto-servernum npm run test:ui:installed

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rpm-test-report
          path: tests/ui/report-installed/

  # ── Promote to nightly release (only if all smoke tests pass) ─────────────
  promote-nightly:
    needs: [resolve-artifact, test-appimage, test-deb, test-rpm]
    if: needs.resolve-artifact.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: stellar-pdf-appimage
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: stellar-pdf-deb
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/

      - name: Download rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: stellar-pdf-rpm
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/

      - name: Publish nightly prerelease
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          name: Nightly (Linux)
          body: |
            Smoke-tested build from commit `${{ github.event.workflow_run.head_sha }}`.
            All three package formats (AppImage, deb, rpm) passed installed smoke tests.

            | Format | Distro |
            |--------|--------|
            | `.AppImage` | Universal |
            | `.deb` | Ubuntu / Debian |
            | `.rpm` | Fedora / RHEL |

            [Build run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.resolve-artifact.outputs.run_id }}) · [Test run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          skipIfReleaseExists: false
