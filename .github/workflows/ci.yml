name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python venv + deps
        run: |
          python -m venv python/venv
          python/venv/bin/pip install -U pip
          python/venv/bin/pip install -r python/requirements.txt
          python/venv/bin/pip install pylint

      - name: Node install
        run: npm ci

      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          python/venv/bin/pip-audit -r python/requirements.txt

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Python lint
        run: npm run lint:python

      - name: Python tests
        run: |
          python/venv/bin/python3 -m pytest --cov --cov-report=term-missing --tb=short 2>&1 | tee /tmp/pytest-output.txt
          {
            echo "## Python Tests"
            echo ""
            grep -E "^=+ .* (passed|failed|error|errors) in " /tmp/pytest-output.txt | tail -1 || true
            awk '
              /^python\// && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+%$/ {
                path = $1
                sub(/^python\//, "", path)
                rows[++n] = sprintf("| `%s` | %s | %s | **%s** |", path, $2, $3, $4)
              }
              END {
                if (n > 0) {
                  print ""
                  print "### Coverage (summary)"
                  print ""
                  print "Per-line *Missing* lists stay in the job log only (pytest `term-missing`)."
                  print ""
                  print "| Module | Stmts | Miss | Cover |"
                  print "|--------|------:|-----:|------:|"
                  for (i = 1; i <= n; i++) print rows[i]
                }
              }
            ' /tmp/pytest-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install system deps for UI tests
        run: sudo apt-get install -y xvfb libgtk-3-0 libgbm-dev libnss3 libasound2

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Generate test fixture PDF
        run: python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: UI tests
        run: |
          xvfb-run --auto-servernum npm run test:ui 2>&1 | tee /tmp/ui-output.txt
          echo "## UI Tests" >> $GITHUB_STEP_SUMMARY
          grep -E "[0-9]+ passed" /tmp/ui-output.txt | tail -1 >> $GITHUB_STEP_SUMMARY

      - name: Install ShellSpec
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes

      - name: ShellSpec tests
        run: |
          ~/.local/lib/shellspec/bin/shellspec --format documentation 2>&1 | tee /tmp/shellspec-output.txt
          echo "## ShellSpec Tests" >> $GITHUB_STEP_SUMMARY
          grep -E "^[0-9]+ examples?" /tmp/shellspec-output.txt >> $GITHUB_STEP_SUMMARY || true

      - name: Build packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y rpm
          npm run pack:linux -- --publish never
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          ls dist/*.AppImage dist/*.deb dist/*.rpm 2>/dev/null | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "| $(basename $f) | $size |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/ui/report/
