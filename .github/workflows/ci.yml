name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python venv + deps
        run: |
          python -m venv python/venv
          python/venv/bin/pip install -U pip
          python/venv/bin/pip install -r python/requirements.txt
          python/venv/bin/pip install pylint pytest

      - name: Node install
        run: npm ci

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Python lint
        run: npm run lint:python

      - name: Python tests
        run: npm run test:python

      - name: Install system deps for UI tests
        run: sudo apt-get install -y xvfb libgtk-3-0 libgbm-dev libnss3 libasound2

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Generate test fixture PDF
        run: python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: UI tests
        run: xvfb-run --auto-servernum npm run test:ui

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/ui/report/
