name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python venv + deps
        run: |
          python -m venv python/venv --copies
          python/venv/bin/pip install -U pip
          python/venv/bin/pip install -r python/requirements.txt
          python/venv/bin/pip install pylint

      - name: Node install
        run: npm ci

      - name: Node script tests (venv bundle guard)
        run: npm run test:scripts

      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          python/venv/bin/pip-audit -r python/requirements.txt

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Python lint
        run: npm run lint:python

      - name: Python tests
        run: |
          python/venv/bin/python3 -m pytest --cov --cov-report=term-missing --tb=short 2>&1 | tee /tmp/pytest-output.txt

      - name: Install system deps for UI tests
        run: sudo apt-get install -y xvfb libgtk-3-0 libgbm-dev libnss3 libasound2

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Generate test fixture PDF
        run: python/venv/bin/python3 python/tests/generate_test_pdf.py tests/fixtures/test_form.pdf

      - name: UI tests
        run: |
          xvfb-run --auto-servernum npm run test:ui 2>&1 | tee /tmp/ui-output.txt

      - name: Install ShellSpec
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes

      - name: ShellSpec tests
        run: |
          ~/.local/lib/shellspec/bin/shellspec --format documentation 2>&1 | tee /tmp/shellspec-output.txt

      - name: Write job summary (test results + coverage)
        if: always()
        env:
          PYTEST_OUTPUT: /tmp/pytest-output.txt
          PLAYWRIGHT_JSON: tests/ui/playwright-results.json
          PLAYWRIGHT_LIST_PATH: /tmp/ui-output.txt
          SHELLSPEC_OUTPUT: /tmp/shellspec-output.txt
        run: python3 .github/scripts/ci_job_summary.py

      - name: Check packaging-relevant changes
        id: pkg_changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin ${{ github.base_ref }}
            CHANGED=$(git diff --name-only FETCH_HEAD HEAD)
            echo "$CHANGED"
            if echo "$CHANGED" | grep -qE "(main\.js|preload\.js|pdf_server\.py|package\.json|linux-appimage\.yml)"; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.pkg_changed.outputs.changed == 'true'
        run: |
          sudo apt-get install -y rpm
          python/venv/bin/pyinstaller --onefile --name pdf_server \
            --distpath python/dist python/pdf_server.py
          chmod +x python/dist/pdf_server
          npm run pack:linux -- --publish never
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          ls dist/*.AppImage dist/*.deb dist/*.rpm 2>/dev/null | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "| $(basename $f) | $size |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.pkg_changed.outputs.changed == 'true') && always()
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/ui/report/
