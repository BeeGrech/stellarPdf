name: Nightly AppImage

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last nightly
        id: check
        run: |
          LAST_SHA=$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || echo "")
          if [ -z "$LAST_SHA" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$LAST_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Set up Python venv
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m venv python/venv
          python/venv/bin/pip install PyMuPDF

      - name: Build AppImage
        if: steps.check.outputs.skip != 'true'
        run: npm run pack:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly release
        if: steps.check.outputs.skip != 'true'
        run: gh release delete nightly --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        if: steps.check.outputs.skip != 'true'
        run: |
          gh release create nightly \
            --title "Nightly Build" \
            --notes "Latest build from \`$(git log -1 --format='%h %s')\`" \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            dist/*.AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
